# JUnit suite runs entirely on in-memory H2. No Postgres, Docker, or network
# access is required. Individual tests may override the URL with their own
# in-memory database name; those overrides take precedence over this file.
spring.datasource.url=jdbc:h2:mem:digitalschool-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Never start the Telegram long-polling bot during tests.
spring.autoconfigure.exclude=org.telegram.telegrambots.longpolling.starter.TelegramBotStarterConfiguration
